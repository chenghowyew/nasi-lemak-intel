
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasi Lemak Intelligence</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f8f9fa; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        .header-controls { padding: 15px; background: white; border-bottom: 1px solid #dee2e6; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .filter-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; font-size: 14px; }
        
        /* Submission Tray - Adjusted so it doesn't block the map until needed */
        .tray { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            padding: 20px; border-top: 4px solid #d35400; z-index: 2000; 
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15); display: none; 
            max-height: 50vh; overflow-y: auto; border-radius: 20px 20px 0 0;
        }

        input, textarea, button { width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 8px; border: 1px solid #ced4da; box-sizing: border-box; font-size: 16px; }
        button { background: #d35400; color: white; font-weight: 600; border: none; cursor: pointer; }
        button:disabled { background: #adb5bd; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        
        .search-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; background: #fff; }
        .flag-btn { background: #e74c3c; padding: 6px; font-size: 11px; margin-top: 8px; border-radius: 4px; width: auto; display: inline-block; }
    </style>
</head>
<body>

    <div class="header-controls">
        <button onclick="toggleTray()">+ Add New Nasi Lemak Spot</button>
        <div class="filter-group">
            <b>Min Rating: <span id="ratingVal">0</span>★</b>
            <input type="range" id="minRating" min="0" max="5" step="0.5" value="0" oninput="updateMarkers()" style="flex-grow:1">
        </div>
        <div class="filter-group">
            <label><input type="checkbox" id="sethlui" checked onchange="updateMarkers()"> SethLui</label>
            <label><input type="checkbox" id="friends" checked onchange="updateMarkers()"> Community</label>
        </div>
    </div>

    <div id="map"></div>

    <div id="submissionTray" class="tray">
        <h3 style="margin:0 0 5px 0">Register Stall</h3>
        <p id="hintText" style="font-size:13px; color:#d35400; margin-bottom:15px; font-weight:bold;">Tap map to drop pin, then drag to move!</p>
        
        <input type="text" id="searchAddress" placeholder="🔍 Search stall name/place..." oninput="searchLocation(this.value)">
        <div id="searchResults"></div>

        <input type="text" id="stallName" placeholder="Stall Name">
        <textarea id="stallDesc" placeholder="Brief review..."></textarea>
        
        <div style="background:#f1f3f5; padding:10px; border-radius:8px; margin-bottom:15px; font-size:12px;">
            <b>Location:</b> <span id="coordDisplay">Not set</span>
        </div>

        <label style="font-size: 14px; font-weight: bold;">Your Rating (1-5):</label>
        <input type="range" id="stallRating" min="1" max="5" step="0.5" value="4" oninput="this.nextElementSibling.value = this.value + ' ★'">
        <output style="font-weight: bold; color: #d35400;">4 ★</output>
        <button id="submitBtn" onclick="submitToSupabase()" disabled>🚀 Confirm & Submit</button>
        <button class="btn-secondary" onclick="toggleTray()">Cancel</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. SET UP ---
        const SUPABASE_URL = 'https://jhbnokxiymyakodcqqeq.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoYm5va3hpeW15YWtvZGNxcWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MjI2OTQsImV4cCI6MjA4ODA5ODY5NH0.VjRKwTlXKmcVgHLmmEle0TfpNCTFhb6mkFYOGpsOKQI';

        // Initialize Map
        var map = L.map('map', { tap: false }).setView([1.3521, 103.8198], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var markerGroup = L.layerGroup().addTo(map);
        
        // This is the Draggable "Submission" Pin
        var submissionPin = L.marker([0,0], { 
            draggable: true, 
            autoPan: true 
        }).addTo(map);
        submissionPin.setOpacity(0);

        let allStalls = [];

        // --- 2. DRAGGING LOGIC ---
        
        // Update coordinates whenever the pin is moved
        submissionPin.on('drag', function(e) {
            updateCoords(e.target.getLatLng());
        });

        submissionPin.on('dragend', function(e) {
            updateCoords(e.target.getLatLng());
            map.panTo(e.target.getLatLng());
        });

        function updateCoords(latlng) {
            document.getElementById('coordDisplay').innerText = latlng.lat.toFixed(5) + ", " + latlng.lng.toFixed(5);
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').style.background = "#d35400";
        }

        // --- 3. MAP CLICK (Drop the pin) ---
        map.on('click', function(e) {
            if (document.getElementById('submissionTray').style.display === 'block') {
                submissionPin.setLatLng(e.latlng).setOpacity(1);
                updateCoords(e.latlng);
                document.getElementById('hintText').innerText = "📍 Pin dropped! Drag it to fine-tune.";
            }
        });

        // --- 4. SUPABASE DATA ---
        async function loadData() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/stalls?select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            allStalls = await res.json();
            updateMarkers();
        }

        function updateMarkers() {
            markerGroup.clearLayers();
            const minRating = parseFloat(document.getElementById('minRating').value);
            document.getElementById('ratingVal').innerText = minRating;

            const showSeth = document.getElementById('sethlui').checked;
            const showFriends = document.getElementById('friends').checked;

            allStalls.forEach(stall => {
                const source = (stall.source || 'friends').toLowerCase();
                const rating = stall.rating || 0;
                
                let visible = false;
                if (source === 'sethlui' && showSeth) visible = true;
                if (source === 'friends' && showFriends) visible = true;

                if (visible && rating >= minRating) {
                    const m = L.marker([stall.lat, stall.lng]).addTo(markerGroup);
                    const popupContent = `
                        <div style="min-width:140px">
                            <b>${stall.name}</b><br>${stall.description || ''}<br>
                            <small>Source: ${source}</small><br>
                            <button class="flag-btn" onclick="reportStall(${stall.id})">🚩 Report Issue</button>
                        </div>
                    `;
                    m.bindPopup(popupContent);
                }
            });
        }

        // --- 5. SEARCH & SUBMISSION ---
        async function searchLocation(q) {
            if (q.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${q}&lat=1.3521&lon=103.8198`);
            const data = await res.json();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            
            data.features.forEach(f => {
                const name = f.properties.name || f.properties.street || "Unknown";
                const d = document.createElement('div');
                d.className = 'search-item';
                d.innerText = name;
                d.onclick = () => {
                    document.getElementById('stallName').value = name;
                    const c = f.geometry.coordinates;
                    submissionPin.setLatLng([c[1], c[0]]).setOpacity(1);
                    updateCoords({lat: c[1], lng: c[0]});
                    map.setView([c[1], c[0]], 17);
                    resultsDiv.innerHTML = '';
                };
                resultsDiv.appendChild(d);
            });
        }

        async function submitToSupabase() {
            const latlng = submissionPin.getLatLng();
            const payload = {
                name: document.getElementById('stallName').value || "New Stall",
                description: document.getElementById('stallDesc').value,
                lat: latlng.lat,
                lng: latlng.lng,
                source: 'friends',
                rating: parseFloat(document.getElementById('stallRating').value) // <--- Use the user's rating!
            };

            const response = await fetch(`${SUPABASE_URL}/rest/v1/stalls`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Success! Check the map.");
                toggleTray();
                loadData();
            }
        }

        async function reportStall(id) {
            const reason = prompt("What's wrong with this stall?");
            if (!reason) return;
            await fetch(`${SUPABASE_URL}/rest/v1/reports`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ stall_id: id, reason: reason })
            });
            alert("Report sent.");
        }

        function toggleTray() {
            const t = document.getElementById('submissionTray');
            const isVisible = t.style.display === 'block';
            t.style.display = isVisible ? 'none' : 'block';
            if (isVisible) submissionPin.setOpacity(0);
        }

        loadData();
    </script>
</body>
</html>
