<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasi Lemak Intel - Pro Mode</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        /* Fixed Controls at Top */
        .controls { padding: 15px; background: #fff; border-bottom: 2px solid #ddd; z-index: 1000; }
        .filter-row { margin-top: 10px; font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
        
        /* Sliding Submission Tray */
        .tray { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: white; padding: 20px; border-top: 3px solid #d35400;
            z-index: 2000; box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            display: none; max-height: 80vh; overflow-y: auto;
        }

        input, button, textarea { width: 100%; margin-bottom: 8px; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #d35400; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-cancel { background: #7f8c8d; }
        .custom-tooltip { background: #d35400; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        #searchResults div { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; background: #fafafa; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="toggleTray()">+ Add New Stall</button>
        
        <div class="filter-row">
            <b>Min Rating: <span id="ratingVal">0</span> ★</b>
            <input type="range" id="minRating" min="0" max="5" step="0.5" value="0" oninput="updateMarkers()" style="width:100%">
        </div>
        <div class="filter-row">
            <label><input type="checkbox" id="sethlui" checked onchange="updateMarkers()"> SethLui</label>
            <label><input type="checkbox" id="friends" checked onchange="updateMarkers()"> Community</label>
        </div>
    </div>

    <div id="map"></div>

    <div id="submissionTray" class="tray">
        <h3 style="margin:0 0 10px 0;">Register Stall</h3>
        <p style="font-size:13px; color:#666; margin-bottom:10px;">Search for a location OR tap the map to pin manually.</p>
        
        <input type="text" id="searchAddress" placeholder="🔍 Search place/address..." oninput="searchLocation(this.value)">
        <div id="searchResults"></div>

        <input type="text" id="stallName" placeholder="Final Stall Name">
        <textarea id="stallDesc" placeholder="What's the verdict? (e.g. Extra spicy sambal!)"></textarea>
        
        <div style="display:flex; gap:10px;">
            <input type="number" id="stallLat" placeholder="Lat" step="any">
            <input type="number" id="stallLng" placeholder="Lng" step="any">
        </div>
        
        <button onclick="submitToSupabase()">🚀 Confirm & Submit</button>
        <button class="btn-cancel" onclick="toggleTray()">Close</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'YOUR_URL';
        const SUPABASE_KEY = 'YOUR_KEY';

        var map = L.map('map').setView([1.3521, 103.8198], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var markerGroup = L.layerGroup().addTo(map);
        var tempMarker = L.marker([0,0]).addTo(map); // For manual pinning
        tempMarker.setOpacity(0);

        let allStalls = [];

        // 1. DATA LOADING
        async function loadData() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/stalls?select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            allStalls = await res.json();
            updateMarkers();
        }

        // 2. FILTERING LOGIC (Restored!)
        function updateMarkers() {
            markerGroup.clearLayers();
            const minRating = parseFloat(document.getElementById('minRating').value);
            document.getElementById('ratingVal').innerText = minRating;

            const showSeth = document.getElementById('sethlui').checked;
            const showFriends = document.getElementById('friends').checked;

            allStalls.forEach(stall => {
                const rating = stall.rating || 0;
                const source = stall.source || 'friends';
                
                let shouldShow = false;
                if (source === 'sethlui' && showSeth) shouldShow = true;
                if (source === 'friends' && showFriends) shouldShow = true;

                if (shouldShow && rating >= minRating) {
                    var m = L.marker([stall.lat, stall.lng]).addTo(markerGroup);
                    m.bindPopup(`<b>${stall.name}</b><br>${stall.description || ''}<br>Rating: ${rating}★`);
                    if(rating > 0) m.bindTooltip(rating + "★", { permanent: true, className: 'custom-tooltip' });
                }
            });
        }

        // 3. MANUAL PINNING CONTINGENCY
        map.on('click', function(e) {
            if (document.getElementById('submissionTray').style.display === 'block') {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                document.getElementById('stallLat').value = lat.toFixed(6);
                document.getElementById('stallLng').value = lng.toFixed(6);
                
                tempMarker.setLatLng(e.latlng).setOpacity(1).bindPopup("Pin Placed!").openPopup();
                if(!document.getElementById('stallName').value) {
                    document.getElementById('stallName').value = "New Stall at " + lat.toFixed(3);
                }
            }
        });

        // 4. SEARCH LOGIC
        async function searchLocation(query) {
            if (query.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${query}&lat=1.3521&lon=103.8198`);
            const data = await res.json();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            
            data.features.forEach(f => {
                const div = document.createElement('div');
                div.innerText = f.properties.name || f.properties.street || "Unknown";
                div.onclick = () => {
                    document.getElementById('stallName').value = f.properties.name || "";
                    document.getElementById('stallLat').value = f.geometry.coordinates[1];
                    document.getElementById('stallLng').value = f.geometry.coordinates[0];
                    resultsDiv.innerHTML = '';
                    map.setView([f.geometry.coordinates[1], f.geometry.coordinates[0]], 16);
                };
                resultsDiv.appendChild(div);
            });
        }

        // 5. SUBMISSION
        async function submitToSupabase() {
            const newStall = {
                name: document.getElementById('stallName').value,
                description: document.getElementById('stallDesc').value,
                lat: parseFloat(document.getElementById('stallLat').value),
                lng: parseFloat(document.getElementById('stallLng').value),
                source: 'friends',
                rating: 5 // Default for now
            };

            const response = await fetch(`${SUPABASE_URL}/rest/v1/stalls`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(newStall)
            });

            if (response.ok) {
                alert("Stall Added!");
                toggleTray();
                tempMarker.setOpacity(0);
                loadData();
            }
        }

        function toggleTray() {
            const t = document.getElementById('submissionTray');
            t.style.display = (t.style.display === 'block') ? 'none' : 'block';
        }

        loadData();
    </script>
</body>
</html>
